name: Gradle Build
permissions:
  contents: read

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: graalvm
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run setupDecompWorkspace
      run: ./gradlew setupDecompWorkspace
      continue-on-error: true

    - name: Run generateBuildConfig
      run: ./gradlew generateBuildConfig
      continue-on-error: true

    - name: Build with Gradle
      run: ./gradlew build
    
    - name: Upload build artifacts
      run: |
        for file in build/libs/*; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            artifact_name="${filename%.*}"
            echo "Uploading $file as artifact: $artifact_name"
            gh run upload-artifact "$file" --name "$artifact_name"
          fi
        done
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
